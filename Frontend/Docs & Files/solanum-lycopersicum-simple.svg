<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <g id="lf">
      <path d="M0,0 C-44,-26 -44,-92 0,-140 Z" fill="#7ccd5f"/>
      <path d="M0,0 C44,-26 44,-92 0,-140 Z" fill="#4fa645"/>
    </g>
    <!-- compound tomato leaf, points up, ~150 long -->
    <g id="tleaf">
      <rect x="-3" y="-140" width="6" height="140" rx="3" fill="#3f8f3a"/>
      <g transform="translate(0,-28) rotate(-62) scale(0.36)"><use href="#lf"/></g>
      <g transform="translate(0,-28) rotate(62) scale(0.36)"><use href="#lf"/></g>
      <g transform="translate(0,-62) rotate(-55) scale(0.4)"><use href="#lf"/></g>
      <g transform="translate(0,-62) rotate(55) scale(0.4)"><use href="#lf"/></g>
      <g transform="translate(0,-96) rotate(-45) scale(0.36)"><use href="#lf"/></g>
      <g transform="translate(0,-96) rotate(45) scale(0.36)"><use href="#lf"/></g>
      <g transform="translate(0,-122) scale(0.42)"><use href="#lf"/></g>
    </g>
    <g id="tomato">
      <path d="M0,-24 A24,24 0 0 0 0,24 Z" fill="#ec5044"/>
      <path d="M0,-24 A24,24 0 0 1 0,24 Z" fill="#c4352d"/>
      <path d="M0,-22 L-12,-14 L-6,-17 L-4,-27 L0,-18 L4,-27 L6,-17 L12,-14 Z" fill="#3f8f3a"/>
    </g>
  </defs>

  <!-- pot -->
  <path d="M190,395 L230,520 A90,52 0 0 0 410,520 L450,395 Z" fill="#34353a"/>
  <path d="M190,395 L230,520 A90,52 0 0 0 320,572 L320,470 Z" fill="#4a4b50"/>
  <ellipse cx="320" cy="395" rx="130" ry="75" fill="#6a6b70"/>
  <ellipse cx="320" cy="397" rx="106" ry="61" fill="#2a2420"/>

  <!-- stem -->
  <rect x="312" y="190" width="16" height="215" rx="8" fill="#5f8f3a"/>

  <!-- leaves -->
  <g transform="translate(320,352) rotate(-78) scale(1.0)"><use href="#tleaf"/></g>
  <g transform="translate(320,352) rotate(78) scale(1.0)"><use href="#tleaf"/></g>
  <g transform="translate(320,288) rotate(-52) scale(0.9)"><use href="#tleaf"/></g>
  <g transform="translate(320,288) rotate(52) scale(0.9)"><use href="#tleaf"/></g>
  <g transform="translate(320,235) rotate(-26) scale(0.7)"><use href="#tleaf"/></g>
  <g transform="translate(320,235) rotate(26) scale(0.7)"><use href="#tleaf"/></g>
  <g transform="translate(320,200) scale(0.42)"><use href="#tleaf"/></g>

  <!-- fruits -->
  <rect x="266" y="330" width="4" height="22" fill="#3f8f3a" transform="rotate(-10 268 330)"/>
  <g transform="translate(262,368)"><use href="#tomato"/></g>
  <rect x="368" y="305" width="4" height="22" fill="#3f8f3a" transform="rotate(10 370 305)"/>
  <g transform="translate(376,340) scale(0.92)"><use href="#tomato"/></g>
  <g transform="translate(306,305) scale(0.8)"><use href="#tomato"/></g>
</svg>
